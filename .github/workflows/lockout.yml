name: X Lockout Continuo

on:
  schedule:
    - cron: "0 */6 * * *"      # 4 ejecuciones al dia (UTC)
  workflow_dispatch:            # boton para lanzarlo a mano

concurrency:
  group: x-lockout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lockout:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # CAMBIO 1: se instala xvfb (pantalla virtual) junto a las dependencias
      - name: Instalar dependencias
        run: |
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # CAMBIO 2: se ejecuta con "xvfb-run -a" para que haya navegador visible
      - name: Ejecutar lockout
        env:
          OBJETIVO: "elizabethotaval"
          INTENTOS_POR_RAFAGA: "10"
          PAUSA_ENTRE_INTENTOS: "3"
          MAX_JOB_MINUTOS: "340"
          INTERVALO_MINUTOS: "50"
          X_USER:  ${{ secrets.X_USER }}
          X_PASS:  ${{ secrets.X_PASS }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_TOTP:  ${{ secrets.X_TOTP }}
        run: xvfb-run -a python lockout.py

      - name: Subir capturas de error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
